<body>
    <header id="main-header">
    </header>
    <main>
        <section class="welcome">
            <h2>Welcome to The Book Club Manager!</h2>
            <p>Discover everything you need for your next book club meeting. Explore books by title, genre, or author,
            suggest new reads, and vote for your favorites. Organizing your book club has never been easier!</p>
        </section>
        <section id="genreButtons">
            <button data-genre="fiction">Fiction</button>
            <button data-genre="mystery">Mystery</button>
            <button data-genre="romance">Romance</button>
            <button data-genre="horror">Horror</button>
            <button data-genre="fantasy">Fantasy</button>
            <button data-genre="nonfiction">Non-fiction</button>
            <button data-genre="biographies">Biographies</button>
        </section>

        <h1>This Month's Author</h1>
        <ul id="releasesList"></ul>
    </main>
    <footer id="main-footer">
    </footer>
</body>

</html>
